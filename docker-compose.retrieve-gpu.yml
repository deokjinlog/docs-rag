# retrieve 가속 override — api의 임베더·리랭커를 GPU로.
# lite 모드(vLLM off)에선 GPU가 완전히 놀므로 임베더·리랭커에 붙이면 /retrieve·/answer(RAG) 지연이
# 급감한다 — **실측(2026-08-20, RTX 4060 8GB)**: CPU 22s(embed 3.6s+rerank 18.5s) → GPU **~1s
# (0.6~2.4s, ~20x)**. 내역: embed 3.6s→0.055s(66x)·rerank 18.5s→~1s. 단 재시작 후 첫 몇 쿼리는
# CUDA 커널 워밍업으로 5~12s(shape별 컴파일) 뒤 안정. 검색 품질(rerank 0.98+)은 device 무관. 기본 정책
# (임베더·리랭커 CPU·GPU는 vLLM 전용)은 vLLM 경합 회피가 이유라 lite엔 성립 안 함. full(answer)
# 복귀로 vLLM을 올릴 땐 이 override를 빼면 CPU로 자동 복귀(GPU 반납 → vLLM 독점).
#
# 코드 검증(2026-08-20): 임베더 `SentenceTransformer(model_path)`(utils/embedding.py)·리랭커
#   `CrossEncoder(model)`(rag/clients.py) 둘 다 device 파라미터 없음 + config(qdrant.py)·전역
#   torch에도 device 강제 없음 → device는 CUDA_VISIBLE_DEVICES로만 결정. 즉 이 토글은 no-op이
#   아니라 실제로 GPU 이관(=-1→0 하나로 CPU/GPU 전환). 실측만 Docker Desktop WSL 통합 복구 대기.
#
# 적용:  docker compose -f docker-compose.yml -f docker-compose.retrieve-gpu.yml up -d api   (= make retrieve-gpu)
# 반납:  docker compose up -d api   (override 없이 재생성 → CPU, GPU 반납)
services:
  api:
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
