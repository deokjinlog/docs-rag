# 페이지 triage — 라우팅 판정 + 난이도 태그 임계치
#
# **모든 값이 실측에서 나왔다.** 이 프로젝트의 규율은 "분포를 보기 전에 임계치를 정하지
# 않는다"이고(docs/ingest-cascade.md '하지 말 것'), 여기 숫자는 전부 그 순서로 정해졌다.
# 측정 대상: ODL 트리 22문서·3,278페이지·77,539노드 / 관악구 PDF 30건·511페이지 /
#            paddle 산출물 357파일 / 라벨된 합성 스캔셋 7변형 42장.
#
# 좋은 임계치는 **분포의 빈 구간**에 앉는다. 아래 여러 항목이 실제로 그렇게 앉았고,
# 그게 이 값들을 신뢰하는 근거다(칼날 위가 아니라는 뜻).
version: 2

# ── 라우팅 판정 (4-값) ────────────────────────────────────────────────────────
# 순서가 곧 우선순위다. garbage 를 char_count 보다 **먼저** 본다 — char_count 로 먼저
# 통과시키면 깨진 텍스트가 NATIVE 로 새어 조용히 쓰레기를 색인한다.
route:
  char_min: 50            # NATIVE 최소 66자 vs 스캔 최대 46자 → 사이 빈 구간(50~66)에 앉음
  image_cover_high: 0.80  # 네이티브 1,663p 실측 최대 0.756 → 오검출 0
  garbage_max: 0.15       # 실측 최대 0.012 (임계의 1/12). 다른 회사 CID 폰트 대비 여유
  table_score_high: 2
  column_gap_pt: 60

# ── 난이도 태그 ───────────────────────────────────────────────────────────────
tags:
  multi_column:
    # ⚠ x0 클러스터링(들여쓰기)로 세면 안 된다 — 한국어 약관의 중첩 목록(①→1.→가.)이
    # 단으로 잡혀 41.5% 가 발동했고 문서 판별력이 없었다. 중앙부 '세로 홈통'으로 본다.
    # 교체 후 9.4%, 문서별로 갈린다(현대해상 80.0% · 삼성화재 64.7% · KB 0.0%).
    # 판별을 실제로 하는 건 side_blocks_min 쪽이다(홈통 폭은 p50=36pt 라 거의 항상 통과).
    gutter_min_pt: 20
    side_blocks_min: 3
    search_band: [0.25, 0.75]

  table_dense:
    # 면적은 엔진 무관. 셀 수는 **OCR/VL 에서만** — ODL 은 표 보유 페이지의 셀 중앙값이
    # 6개(2x3 표)로 과소 추출이라 기준으로 못 쓴다.
    area_ratio_min: 0.30    # 표 보유 페이지의 p90=0.36 → 전체의 약 2.5%
    cell_count_min: 40
    cell_rule_engines: [ocr, vl]

  tiny_text:
    # KB 약관에는 0% 라 '합성 전용'으로 뒀다가, 관악구 고시에서 **65p(14.2%)** 실사례가
    # 나와 되살렸다. 분포에 빈 구간이 있다: p10=4.0 → p25=9.7 사이에 페이지가 없어
    # 6/7/8 어느 값이든 같은 65p 를 준다. 육안 확인함(A4 가로 30열×40행 명세표, 2.76pt).
    native_pt_max: 7
    scan_px_max_200dpi: 12

  old_scan:
    # **신호가 둘 필요하다.** 히스토그램 폭은 대비 손실(dark)만 잡고 뭉갬(fax150)은 못 잡는다
    # (fax 폭 111~173 이 clean 145~179 와 겹침). 선명도가 그쪽을 맡는다:
    # fax150 33.8~40.4 vs 나머지 최소 67.2 → 임계 55 는 빈 구간 한가운데.
    image_cover_min: 0.80
    hist_span_max: 140      # dark 129~138 vs 비-old_scan 최소 142
    sharpness_max: 55       # 폭 1200 정규화 후 FIND_EDGES 표준편차

  photographed:
    # 4분면 평균 편차는 **폐기했다** — clean 6.8~28.8 이 dark 5.2~20.7 을 완전히 덮는다.
    # 문서 내용이 만드는 밝기 편차가 조명 편차보다 크기 때문. 저주파(32x32 BOX + blur 후
    # p90-p10)로 바꾸니 갈린다: 비-shadow 21~40 vs shadow 81~100 → 임계 60(마진 2.0배).
    skew_deg_min: 1.5
    illum_lowfreq_dev_max: 60

  formula:
    # paddle 산출물 **357파일 전수에서 0건**. 표본이 아니라 전수라 Formula 축은 N/A 확정.
    label: formula

  figure_labeled:
    # 그림 안에 라벨이 있는 경우(치아 구조도 같은) — OCR 이 VL 을 이긴 바로 그 케이스다.
    # 글자수 분포에 빈 구간이 있다: ... 2, 2, 8 │ 22, 25, 71 ... → 임계 20 이 그 사이.
    labels: [figure, chart, image]
    ocr_chars_min: 20

  header_footer:
    # ODL 트리에는 이미 없다(밴드 텍스트 반복률 최고 17.4%, 그마저 본문). OCR/VL 전용.
    engines: [ocr, vl]
    drop_labels: [header, footer, page_number]
    repeat_page_ratio_min: 0.50
