services:
  postgres:
    image: postgres:16.6
    container_name: docs-rag-postgres
    environment:
      POSTGRES_DB: docsrag
      POSTGRES_USER: docsrag
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
    ports:
      - "5433:5432"   # 외부(DBeaver 등)=5433, 내부 앱은 postgres:5432 — homie postgres(5432) 충돌 회피
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: unless-stopped

  qdrant:
    # GPU 인덱싱 활성화 위해 GPU 빌드 이미지 사용 (Qdrant 1.13+).
    image: qdrant/qdrant:v1.17.1-gpu-nvidia
    container_name: docs-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: docs-rag-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:v0.18.1
    container_name: docs-rag-vllm
    mem_limit: 6g          # 시스템 RAM 상한(GPU VRAM은 별개). 실측 ~3GB, 넉넉한 천장 — 8GB 박스에서 한 컨테이너 폭주가 WSL 전체를 스왑으로 끌고 가는 것 차단
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - ./model/Qwen3-4B-AWQ:/model   # 로컬 LLM (scripts/download_models.sh) — GPU 독점. 모델 교체 시 이 경로 + .env LLM_TOKENIZER_PATH 동시 변경
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    command: >
      --model /model
      --tensor-parallel-size 1
      --max-model-len 8192
      --gpu-memory-utilization 0.80
      --kv-cache-dtype fp8_e4m3
    restart: unless-stopped

  paddle:
    build: ./paddle
    container_name: docs-rag-paddle
    mem_limit: 3g          # OCR(PP-StructureV3 CPU) 피크 방어. 실측 ~1.7-2.5GB
    ports:
      - "5003:5003"
    volumes:
      - ./data:/data
      - paddle_cache:/root/.paddlex
    environment:
      # Why CPU mode: RTX PRO 6000 Blackwell(sm_120) 지원이 현재 paddlepaddle
      # 공식 배포 wheel(3.3.1-cuda13.0)에 미포함. device_count()가 0으로 떨어지고
      # set_device('gpu:0')가 "no GPU detected"로 실패.
      # Paddle 3.4+ Blackwell 공식 지원이 나오면 CUDA_VISIBLE_DEVICES=0으로 복귀.
      - CUDA_VISIBLE_DEVICES=-1
      - FLAGS_use_mkldnn=0
      - FLAGS_enable_pir_in_executor=0
    restart: unless-stopped

  odl:
    build: ./odl
    container_name: docs-rag-odl
    mem_limit: 3g          # Java docling(대형 PDF) 피크 방어
    environment:
      # 대형 PDF(700p+) Java 힙 OOM 방어 — 기본힙(~0.75g)이 700~1200p 약관에서 터짐.
      # 3g 컨테이너 캡(누수방어) 안에서 힙 2g(비힙·OS용 ~1g 여유). Dockerfile ENV override.
      - JAVA_TOOL_OPTIONS=-Xmx2g -Djava.util.logging.ConsoleHandler.level=WARNING
    ports:
      - "5002:5002"
    volumes:
      - ./data:/data
    restart: unless-stopped

  api:
    image: docs-rag-app
    build: .
    container_name: docs-rag-api
    mem_limit: 3g          # ★ 누수 방어 핵심 — 실측 정상 1.5GB인데 수 시간 만에 4.58GB로 부풀어 WSL을 스왑으로 밀어넣고 qdrant·postgres·네트워크까지 동반 붕괴시킴. 3g에서 OOM-kill+자동재시작(unless-stopped)으로 국소 격리. 근본 누수는 별도 추적 대상
    command: uvicorn api:app --host 0.0.0.0 --port 8002 --app-dir src
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      # Feedback 수집 토글 — 점진적 롤아웃 / 인프라 문제 시 즉시 비활성화 ("false")
      FEEDBACK_ENABLED: "${FEEDBACK_ENABLED:-true}"
      # Critic dispatch 토글 — 기본 off (실측 hard_fail 대부분 오탐, design-retrospective §1.5)
      CRITIC_DISPATCH_ENABLED: "${CRITIC_DISPATCH_ENABLED:-false}"
      # 임베더·리랭커를 CPU로 → GPU는 vLLM 독점 (8GB 프로파일)
      CUDA_VISIBLE_DEVICES: "-1"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./model:/app/model
      - ./tests:/app/tests   # docker exec uv run pytest용 — host 변경 즉시 반영 (conftest.py 포함)
      - ./scripts:/app/scripts   # docker exec uv run python scripts/… 용 (색인·평가; BGE-M3가 컨테이너에만 있음)
    # 임베더·리랭커는 CPU (CUDA_VISIBLE_DEVICES=-1) — GPU 예약 없음 (8GB 프로파일, GPU는 vLLM 전용)
    depends_on:
      - postgres
      - qdrant
      - rabbitmq
      - odl
      - vllm
    restart: unless-stopped

  celery:
    image: docs-rag-app
    container_name: docs-rag-celery
    mem_limit: 3g          # 임베딩 시 BGE-M3/리랭커 로드 피크 방어
    command: celery -A celery_app:celery_app worker --loglevel=info --pool=threads --concurrency=10 -E
    working_dir: /app/src
    env_file: .env
    environment:
      # 임베더를 CPU로 → GPU는 vLLM 독점 (8GB 프로파일). 인제스천은 오프라인이라 CPU로 충분
      CUDA_VISIBLE_DEVICES: "-1"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./model:/app/model
    # 임베더는 CPU (CUDA_VISIBLE_DEVICES=-1) — GPU 예약 없음 (8GB 프로파일)
    depends_on:
      - postgres
      - qdrant
      - rabbitmq
      - odl
      - vllm
    restart: unless-stopped

  flower:
    image: docs-rag-app
    container_name: docs-rag-flower
    mem_limit: 512m        # 모니터링 UI — 작게 고정 (실측 ~440MB)
    command: celery -A celery_app:celery_app flower --port=5555
    working_dir: /app/src
    ports:
      - "5555:5555"
    env_file: .env
    volumes:
      - ./src:/app/src
    depends_on:
      - celery
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  paddle_cache:
