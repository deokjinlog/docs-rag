name: CI

# "배포 관문"(199 유닛 + 판별식)을 push마다 자동으로. 스택·모델(paddle/torch) 없이 도는
# 자립 테스트만 — make check(골든)는 원천 약관을 public repo에 안 올려(저작권) CI 밖.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: 유닛 테스트 + 판별식 (스택 불필요)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # tests/ 대부분은 무거운 import 없음 → light dep만 설치해 빠르고 안정(로컬 --isolated 194 passed 1s).
      # integration 마크는 pyproject addopts로 자동 skip. test_chunker_heading만 sentence-transformers
      # (torch) 필요한 모델계층 테스트라 스택-free CI에선 제외(docker integration 경로에서 커버).
      - name: 유닛 테스트 (194, integration·모델의존 제외)
        run: >
          uv run --no-project --python 3.12
          --with pytest --with sqlalchemy --with pydantic --with fastapi
          --with langchain-openai --with qdrant-client --with tqdm
          --with python-dotenv --with psycopg2-binary
          python -m pytest tests/ -q --ignore=tests/test_chunker_heading.py

      # 병목 판별식 — 커밋된 baseline(retrieval_baseline·bottleneck_verdict)만 읽어 스택 없이 판정.
      - name: 병목 판별식 (retrieval-bound vs generation-bound)
        run: uv run --no-project --python 3.12 python scripts/diagnose_bottleneck.py
